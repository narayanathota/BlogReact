# Non-secret settings shared by the backend, the frontend and MySQL.
# Passwords and the JWT secret are NOT here; they live in the "blogapp-secrets" Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: blogapp-config
  namespace: blogapp
data:
  PORT: "5000"
  DB_HOST: mysql-service
  DB_PORT: "3306"
  DB_USER: bloguser
  DB_NAME: blogdb
  CORS_ORIGIN: "*"          # tighten to the ALB URL once it exists
  BACKEND_HOST: backend-service
  BACKEND_PORT: "5000"
