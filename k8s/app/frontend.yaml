apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: blogapp
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: blogapp
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: IMAGE_FRONTEND           # replaced by Jenkins with the versioned ECR image
          ports:
            - containerPort: 8080
          env:
            - name: BACKEND_HOST
              valueFrom: { configMapKeyRef: { name: blogapp-config, key: BACKEND_HOST } }
            - name: BACKEND_PORT
              valueFrom: { configMapKeyRef: { name: blogapp-config, key: BACKEND_PORT } }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
