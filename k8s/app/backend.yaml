apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: blogapp
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http          # the monitoring ServiceMonitor looks for this port name
      port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: blogapp
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }   # never drop below 2 ready pods during a deploy
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: backend
          image: IMAGE_BACKEND            # replaced by Jenkins with the versioned ECR image
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef: { name: blogapp-config }
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: blogapp-secrets, key: DB_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: blogapp-secrets, key: JWT_SECRET } }
          readinessProbe:                  # ready only when the database is reachable
            httpGet: { path: /readyz, port: 5000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:                   # restarted if the process stops answering
            httpGet: { path: /healthz, port: 5000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
