apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: blogapp-eks-cluster
  region: ap-south-1
iam:
  withOIDC: true
managedNodeGroups:
  - name: ng-1
    # t3.medium is not allowed on the AWS Free plan; m7i-flex.large is eligible (2 vCPU, 8 GB)
    instanceType: m7i-flex.large
    minSize: 2
    desiredCapacity: 2
    maxSize: 3
    volumeSize: 30
addons:
  - name: vpc-cni
    configurationValues: '{"enableNetworkPolicy":"true"}'
  - name: aws-ebs-csi-driver
    wellKnownPolicies:
      ebsCSIController: true
