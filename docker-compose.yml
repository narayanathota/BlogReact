# Local testing only. Run with:  docker compose --env-file backend/.env up --build -d
# Real deployment uses the manifests in k8s/ instead.
services:
  mysql-service:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      # runs once, on first start with an empty data volume
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    env_file: ./backend/.env
    depends_on:
      mysql-service:
        condition: service_healthy
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "5000"
    depends_on:
      - backend
    ports:
      - "3000:8080"

volumes:
  mysql-data:
